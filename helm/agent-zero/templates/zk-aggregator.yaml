{{- if .Values.zk.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "agent-zero.fullname" . }}-zk-aggregator
  labels:
    {{- include "agent-zero.labels" . | nindent 4 }}
    app.kubernetes.io/component: zk-aggregator
spec:
  schedule: {{ .Values.zk.aggregator.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "agent-zero.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: zk-aggregator
        spec:
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          serviceAccountName: {{ include "agent-zero.serviceAccountName" . }}
          restartPolicy: OnFailure
          containers:
            - name: zk-aggregator
              image: "{{ .Values.zk.aggregator.image.repository }}:{{ .Values.zk.aggregator.image.tag }}"
              imagePullPolicy: {{ .Values.zk.aggregator.image.pullPolicy }}
              env:
                - name: DD7_CLUSTER_ID
                  value: {{ .Values.attestation.clusterID | quote }}
                - name: DD7_PERSONA
                  value: {{ .Values.persona.default | quote }}
                - name: DD7_PHI_THRESHOLD
                  value: {{ .Values.zk.phiThreshold | quote }}
                {{- if .Values.spire.enabled }}
                - name: SPIRE_TRUST_DOMAIN
                  value: {{ .Values.spire.trustDomain | quote }}
                {{- end }}
              volumeMounts:
                {{- if .Values.storage.glass.enabled }}
                - name: glass-storage
                  mountPath: {{ .Values.storage.glass.mountPath }}
                {{- end }}
                {{- if .Values.spire.enabled }}
                - name: spire-socket
                  mountPath: /run/spire/sockets
                  readOnly: true
                {{- end }}
              resources:
                {{- toYaml .Values.zk.aggregator.resources | nindent 16 }}
          volumes:
            {{- if .Values.storage.glass.enabled }}
            - name: glass-storage
              persistentVolumeClaim:
                claimName: {{ include "agent-zero.fullname" . }}-glass
            {{- end }}
            {{- if .Values.spire.enabled }}
            - name: spire-socket
              hostPath:
                path: {{ .Values.spire.socketPath | dir }}
                type: DirectoryOrCreate
            {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
