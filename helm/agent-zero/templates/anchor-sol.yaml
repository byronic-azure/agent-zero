{{- if .Values.anchors.solana.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "agent-zero.fullname" . }}-anchor-sol
  labels:
    {{- include "agent-zero.labels" . | nindent 4 }}
    app.kubernetes.io/component: anchor-sol
spec:
  schedule: {{ .Values.anchors.solana.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            {{- include "agent-zero.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: anchor-sol
          annotations:
            dd7.ai/anchor-chain: "solana"
        spec:
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          serviceAccountName: {{ include "agent-zero.serviceAccountName" . }}
          restartPolicy: OnFailure
          containers:
            - name: anchor-sol
              image: "{{ .Values.anchors.solana.image.repository }}:{{ .Values.anchors.solana.image.tag }}"
              imagePullPolicy: {{ .Values.anchors.solana.image.pullPolicy }}
              env:
                - name: DD7_CLUSTER_ID
                  value: {{ .Values.attestation.clusterID | quote }}
                - name: DD7_PERSONA
                  value: {{ .Values.persona.default | quote }}
                - name: SOL_PROGRAM
                  value: {{ .Values.anchors.solana.program | quote }}
                - name: SOL_RPC_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.anchors.solana.rpcSecret }}
                      key: rpc-url
                - name: SOL_PRIVATE_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.anchors.solana.rpcSecret }}
                      key: private-key
              volumeMounts:
                {{- if .Values.storage.glass.enabled }}
                - name: glass-storage
                  mountPath: {{ .Values.storage.glass.mountPath }}
                {{- end }}
              resources:
                {{- toYaml .Values.anchors.solana.resources | nindent 16 }}
          volumes:
            {{- if .Values.storage.glass.enabled }}
            - name: glass-storage
              persistentVolumeClaim:
                claimName: {{ include "agent-zero.fullname" . }}-glass
            {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
