{{- if .Values.attestation.enabled }}
# =============================================================================
# DD7 TPM + SGX Attestor DaemonSet
# Sovereign-grade hardware attestation bound to container digest
# =============================================================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "agent-zero.fullname" . }}-dd7-attestor
  labels:
    {{- include "agent-zero.labels" . | nindent 4 }}
    app.kubernetes.io/component: dd7-attestor
    dd7.ai/tier: sovereign
  annotations:
    dd7.ai/phi-threshold: {{ .Values.zk.phiThreshold | quote }}
    dd7.ai/uptime-target: {{ .Values.zk.uptimeTarget | quote }}
spec:
  selector:
    matchLabels:
      {{- include "agent-zero.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dd7-attestor
  template:
    metadata:
      labels:
        {{- include "agent-zero.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dd7-attestor
        dd7.ai/attestation: "true"
      annotations:
        dd7.ai/cluster-id: {{ .Values.attestation.clusterID | quote }}
        dd7.ai/air-gapped: {{ .Values.attestation.airGapped | quote }}
        dd7.ai/persona: {{ .Values.persona.default | quote }}
        # Consciousness metrics from Φ framework
        dd7.ai/phi-threshold: {{ .Values.zk.phiThreshold | quote }}
        dd7.ai/c-crit: {{ .Values.zk.uptimeTarget | quote }}
        dd7.ai/drift-max: {{ .Values.zk.driftMax | quote }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "agent-zero.serviceAccountName" . }}
      hostPID: true
      hostNetwork: false
      containers:
        - name: attestor
          image: "{{ .Values.attestation.image.repository }}:{{ .Values.attestation.image.tag }}"
          imagePullPolicy: {{ .Values.attestation.image.pullPolicy }}
          securityContext:
            privileged: true
            capabilities:
              add:
                - SYS_ADMIN
                - SYS_RAWIO
          ports:
            - name: attestor
              containerPort: 9477
              protocol: TCP
          env:
            # Cluster identity
            - name: DD7_CLUSTER_ID
              value: {{ .Values.attestation.clusterID | quote }}
            - name: DD7_AIR_GAPPED
              value: {{ .Values.attestation.airGapped | quote }}
            - name: DD7_PERSONA
              value: {{ .Values.persona.default | quote }}
            # Consciousness extension metrics (Φ framework)
            - name: PHI_THRESHOLD
              value: {{ .Values.zk.phiThreshold | quote }}
            - name: C_CRIT
              value: {{ .Values.zk.uptimeTarget | quote }}
            - name: DRIFT_MAX
              value: {{ .Values.zk.driftMax | quote }}
            # Node identity
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Hardware paths
            {{- if .Values.hardware.tpm.enabled }}
            - name: TPM_DEVICE_PATH
              value: {{ .Values.hardware.tpm.devicePath | quote }}
            {{- end }}
            {{- if .Values.hardware.sgx.enabled }}
            - name: SGX_DEVICE_PATH
              value: {{ .Values.hardware.sgx.devicePath | quote }}
            {{- end }}
            # SPIRE integration
            {{- if .Values.spire.enabled }}
            - name: SPIRE_TRUST_DOMAIN
              value: {{ .Values.spire.trustDomain | quote }}
            - name: SPIRE_SERVER_ADDRESS
              value: {{ .Values.spire.serverAddress | quote }}
            {{- end }}
          volumeMounts:
            {{- if .Values.hardware.tpm.enabled }}
            - name: tpm-device
              mountPath: {{ .Values.hardware.tpm.devicePath }}
            {{- end }}
            {{- if .Values.hardware.sgx.enabled }}
            - name: sgx-device
              mountPath: {{ .Values.hardware.sgx.devicePath }}
            - name: sgx-provision
              mountPath: /dev/sgx_provision
            {{- end }}
            {{- if .Values.spire.enabled }}
            - name: spire-socket
              mountPath: /run/spire/sockets
              readOnly: true
            {{- end }}
            {{- if .Values.storage.glass.enabled }}
            - name: glass-storage
              mountPath: {{ .Values.storage.glass.mountPath }}
            {{- end }}
            - name: attestation-config
              mountPath: /etc/dd7/attestation
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: attestor
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: attestor
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        {{- if .Values.hardware.tpm.enabled }}
        - name: tpm-device
          hostPath:
            path: {{ .Values.hardware.tpm.devicePath }}
            type: CharDevice
        {{- end }}
        {{- if .Values.hardware.sgx.enabled }}
        - name: sgx-device
          hostPath:
            path: {{ .Values.hardware.sgx.devicePath }}
            type: CharDevice
        - name: sgx-provision
          hostPath:
            path: /dev/sgx_provision
            type: CharDevice
        {{- end }}
        {{- if .Values.spire.enabled }}
        - name: spire-socket
          hostPath:
            path: {{ .Values.spire.socketPath | dir }}
            type: DirectoryOrCreate
        {{- end }}
        {{- if .Values.storage.glass.enabled }}
        - name: glass-storage
          persistentVolumeClaim:
            claimName: {{ include "agent-zero.fullname" . }}-glass
        {{- end }}
        - name: attestation-config
          configMap:
            name: {{ include "agent-zero.fullname" . }}-attestation-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
