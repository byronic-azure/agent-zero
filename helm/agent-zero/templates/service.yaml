apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-zero.fullname" . }}
  labels:
    {{- include "agent-zero.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.sshPort }}
      targetPort: ssh
      protocol: TCP
      name: ssh
    {{- range .Values.service.additionalPorts }}
    - port: {{ .port }}
      targetPort: {{ .targetPort }}
      protocol: TCP
      name: {{ .name }}
    {{- end }}
  selector:
    {{- include "agent-zero.selectorLabels" . | nindent 4 }}
