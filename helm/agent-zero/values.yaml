# Default values for agent-zero Helm chart

replicaCount: 1

image:
  repository: agent0ai/agent-zero
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80
  # SSH port for code execution
  sshPort: 22
  # Additional ports (9000-9009 for utilities)
  additionalPorts:
    - name: util-9000
      port: 9000
      targetPort: 9000
    - name: util-9001
      port: 9001
      targetPort: 9001

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: agent-zero.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: agent-zero-tls
  #    hosts:
  #      - agent-zero.local

resources: {}
  # limits:
  #   cpu: 2000m
  #   memory: 4Gi
  # requests:
  #   cpu: 500m
  #   memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Persistence configuration for Agent Zero data
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  # Existing claim name (optional)
  existingClaim: ""
  # Mount path inside the container
  mountPath: /a0

# Environment variables
env: {}
  # OPENAI_API_KEY: ""
  # ANTHROPIC_API_KEY: ""

# Secrets for sensitive environment variables
secrets:
  # Create a secret with API keys
  create: false
  # Name of existing secret to use
  existingSecret: ""
  # Keys to include in the secret
  data: {}
    # OPENAI_API_KEY: ""
    # ANTHROPIC_API_KEY: ""

# Agent Zero specific configuration
agentZero:
  # Web UI host binding
  webUIHost: "0.0.0.0"
  # Web UI port (inside container)
  webUIPort: 80

  # Authentication settings
  auth:
    enabled: false
    login: ""
    # Password should be set via secrets
    passwordSecretKey: "AUTH_PASSWORD"

  # Model configuration
  chatModel:
    provider: "openrouter"
    name: "openai/gpt-4.1"
    contextLength: 100000

  utilModel:
    provider: "openrouter"
    name: "openai/gpt-4.1-mini"
    contextLength: 100000

  embedModel:
    provider: "huggingface"
    name: "sentence-transformers/all-MiniLM-L6-v2"

  # Memory settings
  memory:
    recallEnabled: true
    memorizeEnabled: true
    subdir: "default"

  # MCP Server settings
  mcpServer:
    enabled: false

  # A2A Server settings
  a2aServer:
    enabled: false

# Probes configuration
livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Extra volumes
extraVolumes: []

# Extra volume mounts
extraVolumeMounts: []

# Init containers
initContainers: []

# Sidecar containers
sidecars: []

# =============================================================================
# DD7 Attestation & Integrity Framework
# =============================================================================

# Attestation configuration
attestation:
  enabled: true
  clusterID: "iverse-genesis-prime"
  airGapped: true
  image:
    repository: dd7ai/attestor
    tag: "latest"
    pullPolicy: IfNotPresent

# Hardware security module configuration
hardware:
  tpm:
    enabled: true
    devicePath: /dev/tpmrm0
  sgx:
    enabled: true
    devicePath: /dev/sgx_enclave

# Persona-based policy configuration
persona:
  default: AUTHORITY
  policies:
    stealth:
      anchorFrequency: daily
      disclosure: zk-only
    authority:
      anchorFrequency: hourly
      disclosure: phi-sla
    lab:
      anchorFrequency: manual
      disclosure: raw-hash

# Zero-knowledge proof configuration
zk:
  enabled: true
  phiThreshold: 0.77
  uptimeTarget: 0.9999999997
  driftMax: 0.00000001
  prover:
    image:
      repository: dd7ai/zk-prover
      tag: "latest"
      pullPolicy: IfNotPresent
    schedule: "10 * * * *"  # 10 min past every hour
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 4Gi
  aggregator:
    image:
      repository: dd7ai/zk-aggregator
      tag: "latest"
      pullPolicy: IfNotPresent
    schedule: "30 * * * *"  # 30 min past every hour
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi

# Blockchain anchor configuration
anchors:
  ethereum:
    enabled: true
    schedule: "0 * * * *"  # Every hour
    contract: "0xDD7Anchor..."
    rpcSecret: eth-rpc
    image:
      repository: dd7ai/anchor-eth
      tag: "latest"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  solana:
    enabled: true
    schedule: "5 * * * *"  # 5 min past every hour
    program: "DD7SolAnchor"
    rpcSecret: sol-rpc
    image:
      repository: dd7ai/anchor-sol
      tag: "latest"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# Ledger audit configuration
ledgerAudit:
  enabled: true
  schedule: "45 * * * *"  # 45 min past every hour
  image:
    repository: dd7ai/ledger-audit
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

# Evidence pack generation for regulators
evidencePack:
  enabled: true
  schedule: "0 0 * * *"  # Daily at midnight
  image:
    repository: dd7ai/evidence-pack
    tag: "latest"
    pullPolicy: IfNotPresent
  formats:
    - pdf
    - json
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

# External verifier deployment
verifier:
  enabled: true
  replicaCount: 1
  image:
    repository: dd7ai/verifier
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8443
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

# SPIRE integration for workload identity
spire:
  enabled: true
  # Set to true if using an external SPIRE deployment
  external: false
  trustDomain: "dd7.ai"
  serverAddress: "spire-server.spire:8081"
  socketPath: /run/spire/sockets/agent.sock

# Glass storage for immutable audit logs
storage:
  glass:
    enabled: true
    size: 50Gi
    storageClass: ""
    accessMode: ReadWriteOnce
    mountPath: /glass

# =============================================================================
# RSFS Ultra SwarmCore Integration
# Sovereign trading attestation with quantum protocol verification
# =============================================================================

rsfs:
  enabled: true

  # SwarmCore controller configuration
  swarmcore:
    version: "13.607x"
    mode: "production"
    replicas: 1
    image:
      repository: rsfs/swarmcore
      tag: "13.607x"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 4Gi

  # Quantum protocol configuration
  quantum:
    protocol: "QP-VERIFIED"
    entanglementDepth: 8
    verificationSchedule: "*/15 * * * *"  # Every 15 minutes
    image:
      repository: rsfs/quantum-verifier
      tag: "latest"
      pullPolicy: IfNotPresent

  # Wallet binding configuration
  wallet:
    # Primary wallet address (Solana)
    address: "8B9K12f3W9qcSZkUptiC7hwAjut6WFJ2cPjQ3ikTAAP2"
    chain: "solana"
    bindingSchedule: "0 */2 * * *"  # Every 2 hours
    # Secret containing wallet keypair (use sealed-secrets in production)
    keypairSecret: ""
    image:
      repository: rsfs/wallet-binder
      tag: "latest"
      pullPolicy: IfNotPresent

  # Trading parameters
  trading:
    maxSlippage: 0.5
    riskThreshold: 0.1

  # Trading attestation configuration
  attestation:
    interval: "1h"
    schedule: "0 * * * *"  # Every hour
    image:
      repository: rsfs/trading-attestor
      tag: "latest"
      pullPolicy: IfNotPresent
