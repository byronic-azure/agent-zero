<html>
<head>
  <script type="module">
    import { store } from "/components/sidebar/bottom/sidebar-bottom-store.js";
  </script>
</head>
<body>
  <div x-data>
    <template x-if="$store.sidebarBottom">
      <div class="sidebar-bottom-wrapper">
        <!-- Preferences Panel -->
        <x-component path="sidebar/bottom/preferences/preferences-panel.html"></x-component>

        <!-- RSFS SwarmGuard launcher -->
        <a class="swarmguard-launch" href="/rsfs.html" target="_blank" rel="noopener"
           title="RSFS SwarmGuard — hardened drive defense">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" width="15" height="15" aria-hidden="true">
            <path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z" />
            <path d="M9 12l2 2 4-4" />
          </svg>
          <span>SwarmGuard</span>
        </a>

        <!-- Version Info -->
        <div class="version-info">
          <span id="a0version" x-text="$store.sidebarBottom.versionLabel"></span>
        </div>
      </div>
    </template>
  </div>


  <style>
    /* Sidebar bottom wrapper */
    .sidebar-bottom-wrapper {
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    /* SwarmGuard launcher */
    .swarmguard-launch {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin: 0 var(--spacing-md) 0.5rem var(--spacing-md);
      padding: 0.5rem 0.65rem;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      color: var(--color-text);
      text-decoration: none;
      font-size: var(--font-size-small);
      font-weight: 600;
      letter-spacing: 0.5px;
      opacity: 0.85;
      transition: opacity 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }
    .swarmguard-launch:hover {
      opacity: 1;
      border-color: #3ef0ff;
      background: rgba(62, 240, 255, 0.08);
    }
    .swarmguard-launch svg { color: #3ef0ff; flex-shrink: 0; }

    /* Version label area */
    .version-info {
      line-height: 0.8rem;
      position: relative;
      margin: 0 var(--spacing-md) 1rem var(--spacing-md);
      padding-top: 10px;
      border-top: 1px solid var(--color-border);
    }

    #a0version {
      color: var(--color-text);
      opacity: 0.7;
      font-size: 0.7rem;
      user-select: all;
    }
  </style>
</body>
</html>
